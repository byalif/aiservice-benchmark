---
# Role defaults. Every variable can be overridden with an AISERVICE_* environment variable.

# Namespace filter (exact namespace). Leave empty to auto-discover.
aiservice_namespace: "{{ lookup('env', 'AISERVICE_NAMESPACE') | default('', true) }}"

# Tenant ID filter
aiservice_tenant_id: "{{ lookup('env', 'AISERVICE_TENANT_ID') | default('', true) }}"

# Instance ID filter. Matches namespaces named 'aiservice-<instance_id>-*'.
aiservice_instance_id: "{{ lookup('env', 'AISERVICE_INSTANCE_ID') | default('', true) }}"

# Capability test toggles (AISERVICE_TEST_<CAPABILITY>)
aiservice_test_similarity: "{{ lookup('env', 'AISERVICE_TEST_SIMILARITY') | default('false', true) | bool }}"
aiservice_test_fmea: "{{ lookup('env', 'AISERVICE_TEST_FMEA') | default('false', true) | bool }}"
aiservice_test_mcc: "{{ lookup('env', 'AISERVICE_TEST_MCC') | default('false', true) | bool }}"
aiservice_test_fieldextractor: "{{ lookup('env', 'AISERVICE_TEST_FIELDEXTRACTOR') | default('false', true) | bool }}"
aiservice_test_docsearch: "{{ lookup('env', 'AISERVICE_TEST_DOCSEARCH') | default('false', true) | bool }}"
aiservice_test_nl2oslc: "{{ lookup('env', 'AISERVICE_TEST_NL2OSLC') | default('true', true) | bool }}"
aiservice_test_insights: "{{ lookup('env', 'AISERVICE_TEST_INSIGHTS') | default('false', true) | bool }}"
aiservice_test_pcc: "{{ lookup('env', 'AISERVICE_TEST_PCC') | default('false', true) | bool }}"
aiservice_test_smartcleanse: "{{ lookup('env', 'AISERVICE_TEST_SMARTCLEANSE') | default('false', true) | bool }}"
aiservice_test_almwatsonx: "{{ lookup('env', 'AISERVICE_TEST_ALMWATSONX') | default('false', true) | bool }}"

# Mode: 'capability' (direct to predictor) or 'e2e' (through the gateway)
aiservice_benchmark_mode: "{{ lookup('env', 'AISERVICE_BENCHMARK_MODE') | default('capability', true) }}"

# Workload: 'single' (one record) or 'batch_50' (50 records)
aiservice_workload_type: "{{ lookup('env', 'AISERVICE_WORKLOAD_TYPE') | default('single', true) }}"

# Multi-tenant scaling
aiservice_enable_multi_tenant: "{{ lookup('env', 'AISERVICE_ENABLE_MULTI_TENANT') | default('false', true) | bool }}"
aiservice_tenant_scale_limit: "{{ lookup('env', 'AISERVICE_TENANT_SCALE_LIMIT') | default(10, true) | int }}"

# Load parameters
aiservice_concurrency: "{{ lookup('env', 'AISERVICE_CONCURRENCY') | default(10, true) | int }}"
aiservice_duration: "{{ lookup('env', 'AISERVICE_DURATION') | default(180, true) | int }}"
aiservice_ramp_up: "{{ lookup('env', 'AISERVICE_RAMP_UP') | default(5, true) | int }}"

# Output directories
aiservice_results_dir: "{{ lookup('env', 'AISERVICE_RESULTS_DIR') | default(playbook_dir + '/../results', true) }}"
aiservice_templates_dir: "{{ lookup('env', 'AISERVICE_TEMPLATES_DIR') | default(playbook_dir + '/../model_templates', true) }}"
