---
# ==============================================================================
# Task: 10_discover_models.yml - Query KServe Models & Match Capabilities
# ==============================================================================
# Models are matched by EITHER:
#   • metadata.name                       (e.g. s3similarity-mytenant)
#   • spec.predictor.containers[0].image  (e.g. maximo-similarity-predictor:1.x)
# The image path identifies hash-named ISVCs (e.g. s394f85be0c16811f in another tenant)
# where the name carries no capability information.
# ==============================================================================

- name: Query KServe InferenceServices across all discovered tenant namespaces
  kubernetes.core.k8s_info:
    api_version: serving.kserve.io/v1beta1
    kind: InferenceService
    namespace: "{{ item }}"
  loop: "{{ discovered_tenant_namespaces }}"
  register: raw_isvcs_results

- name: Flatten Discovered InferenceServices
  ansible.builtin.set_fact:
    active_isvcs: "{{ raw_isvcs_results.results | map(attribute='resources') | flatten }}"

# Annotate each ISVC with a 'first_image' field so match tasks can filter on
# a plain string attribute without needing index notation inside selectattr.
# We build a new list one item at a time via loop so the image expression can
# reference the current loop variable directly.
- name: Reset annotated ISVC list
  ansible.builtin.set_fact:
    active_isvcs_annotated: []

- name: Annotate ISVCs with First Container Image
  ansible.builtin.set_fact:
    active_isvcs_annotated: >-
      {{
        active_isvcs_annotated + [
          isvc_item | combine({'first_image':
            (isvc_item.spec.predictor.containers | default([{}]))[0].image | default('')
          })
        ]
      }}
  loop: "{{ active_isvcs }}"
  loop_control:
    loop_var: isvc_item
    label: "{{ isvc_item.metadata.name }}"

- name: Promote annotated list back to active_isvcs
  ansible.builtin.set_fact:
    active_isvcs: "{{ active_isvcs_annotated }}"

- name: Initialize Benchmark Queue
  ansible.builtin.set_fact:
    benchmark_targets: []

# ------------------------------------------------------------------------------
# Match Capabilities to InferenceServices
# Each block unions name-match + image-match results then deduplicates.
# ------------------------------------------------------------------------------

- name: Match Similarity Models
  when: aiservice_test_similarity | bool
  vars:
    pattern: '(?i)similarity'
    by_name:  "{{ active_isvcs | selectattr('metadata.name', 'search', pattern) | list }}"
    by_image: "{{ active_isvcs
                               | selectattr('first_image', 'search', pattern)
                               | list }}"
    matched: "{{ (by_name + by_image) | unique }}"
  ansible.builtin.set_fact:
    benchmark_targets: >-
      {{
        benchmark_targets + [{
          'capability': 'similarity',
          'model_id': item.metadata.name,
          'namespace': item.metadata.namespace,
          'image': (item.spec.predictor.containers | default([{}]))[0].image | default('similarity'),
          'cpu_req': ((item.spec.predictor.containers | default([{}]))[0].resources | default({})).requests.cpu | default('1'),
          'cpu_lim': ((item.spec.predictor.containers | default([{}]))[0].resources | default({})).limits.cpu | default('2'),
          'mem_req': ((item.spec.predictor.containers | default([{}]))[0].resources | default({})).requests.memory | default('4Gi'),
          'mem_lim': ((item.spec.predictor.containers | default([{}]))[0].resources | default({})).limits.memory | default('5Gi')
        }]
      }}
  loop: "{{ matched[:1] }}"

