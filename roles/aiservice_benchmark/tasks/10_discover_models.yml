# ------------------------------------------------------------------------------
# Record the current --workers value of each target (from the ISVC container
# args, in either spec.predictor.model.args or spec.predictor.containers[0].args).
# 0 means the ISVC has no --workers argument.
# ------------------------------------------------------------------------------
- name: Reset worker-annotated target list
  ansible.builtin.set_fact:
    benchmark_targets_annotated: []

- name: Annotate Benchmark Targets with Current Worker Count
  vars:
    _isvc: >-
      {{ active_isvcs
         | selectattr('metadata.name', 'equalto', bt_item.model_id)
         | selectattr('metadata.namespace', 'equalto', bt_item.namespace)
         | first }}
    _args: >-
      {{ ((_isvc.spec.predictor.containers | default([{}]))[0].args
          | default(_isvc.spec.predictor.model.args | default([]))) | join(',') }}
    _workers: "{{ (_args | regex_search('--workers,([0-9]+)', '\\1') | default([0], true) | first) | int }}"
  ansible.builtin.set_fact:
    benchmark_targets_annotated: "{{ benchmark_targets_annotated + [bt_item | combine({'workers': _workers | int})] }}"
  loop: "{{ benchmark_targets }}"
  loop_control:
    loop_var: bt_item
    label: "{{ bt_item.capability }}"

- name: Promote worker-annotated targets
  ansible.builtin.set_fact:
    benchmark_targets: "{{ benchmark_targets_annotated }}"

- name: Display Benchmark Targets Queue
  ansible.builtin.debug:
    msg: "Queued {{ benchmark_targets | length }} capabilities for benchmarking: {{ benchmark_targets | map(attribute='capability') | list }}"
